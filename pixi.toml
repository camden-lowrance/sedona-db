[workspace]
authors = ["Camden Lowrance <camden.lowrance@beckshybrids.com>"]
channels = ["conda-forge"]
name = "sedona-db"
platforms = ["osx-arm64", "win-64"]
version = "0.1.0"

[tasks]
docs-build = "mkdocs build"
docs-serve = "mkdocs serve"
install-python = "python -m pip install -e \"python/sedonadb/[test]\""
test-st-asbinary-rust = "cargo test -p sedona-functions st_asbinary"
test-st-asbinary-geoparquet = "sh -c 'DYLD_FALLBACK_LIBRARY_PATH=\"$CONDA_PREFIX/lib${DYLD_FALLBACK_LIBRARY_PATH:+:$DYLD_FALLBACK_LIBRARY_PATH}\" cargo test -p sedona st_asbinary_geoparquet_returns_binary'"

[dependencies]
python = "3.13.*"
pip = "*"
maturin = ">=1.8,<2"
cmake = ">=4.3.2,<5"
geos = ">=3.14.1,<4"
gdal = ">=3.13.0,<4"
proj = ">=9.8.1,<10"
libabseil = ">=20260107.1,<20260108"
openssl = ">=3.6.2,<4"
pkg-config = ">=0.29.2,<0.30"
pre-commit = "*"
mkdocs = ">=1.6.1,<2"
mkdocs-material = ">=9.7.6,<10"
mkdocs-macros-plugin = ">=1.5.0,<2"
mkdocs-git-revision-date-localized-plugin = ">=1.2.9,<2"
mkdocs-glightbox = ">=0.5.2,<0.6"
mkdocstrings-python = ">=2.0.2,<3"
griffe = ">=2.0.2,<3"
ipykernel = ">=7.2.0,<8"
matplotlib = ">=3.10.9,<4"
mike = ">=2.1.3,<3"
nbconvert = ">=7.17.1,<8"
pyproj = ">=3.7.2,<4"
ruff = ">=0.15.14,<0.16"
lonboard = ">=0.16.0,<0.17"
